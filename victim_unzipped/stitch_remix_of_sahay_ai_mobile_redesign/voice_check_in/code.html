<style>
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: .5; }
        }

            animation: breathe 3s ease-in-out infinite;
        }
        @keyframes breathe {

<p class="font-body-lg text-body-lg text-on-surface-variant">You can speak instead of typing.</p>
</div>
<!-- Recording Interaction Area -->
<div class="relative w-full max-w-[280px] aspect-square flex items-center justify-center my-8">
<!-- Pulsing Rings -->
<div class="absolute inset-0 rounded-full border border-primary-container/20 pulse-ring" style="animation-delay: 0s;"></div>
<div class="absolute inset-4 rounded-full border border-primary-container/40 pulse-ring" style="animation-delay: 0.5s;"></div>
<div class="absolute inset-8 rounded-full border border-primary-container/60 pulse-ring" style="animation-delay: 1s;"></div>
<!-- Microphone Button -->
<button class="relative z-10 w-32 h-32 bg-primary-container text-on-primary-container rounded-full flex flex-col items-center justify-center shadow-[0_8px_16px_rgba(0,128,128,0.2)] hover:bg-primary transition-colors mic-button-active">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- Status Label -->
<div class="bg-surface-container-low px-6 py-3 rounded-full flex items-center gap-3">
<span class="w-3 h-3 bg-error rounded-full animate-pulse"></span>
