<script>
        // Simple micro-interaction to handle visual updates if needed beyond CSS
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('languageForm');
            const radioButtons = form.querySelectorAll('input[type="radio"]');
            
            // The active state styling is handled by CSS peer classes, 
            // but we ensure the initial state matches the checked attribute
            radioButtons.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    // Reset all borders visually (handled by CSS, this is for any extra JS logic)
                    const allContainers = document.querySelectorAll('.radio-custom + div');
                    allContainers.forEach(container => {
                        container.classList.remove('bg-surface-container-low', 'border-primary-container');
                        container.classList.add('bg-surface-container-lowest', 'border-outline-variant');
                        
                        // Reset checkmark styling
                        const checkContainer = container.querySelector('.rounded-full');
                        checkContainer.classList.remove('border-primary-container', 'bg-primary-container');
                        checkContainer.classList.add('border-outline');
                        
                        const icon = container.querySelector('.material-symbols-outlined');
                        icon.classList.remove('check-icon-active');
                        icon.classList.add('check-icon');
                    });

                    // Set active visual for checked (redundant with CSS but good for robust state management)
                    const activeContainer = e.target.nextElementSibling;
                    activeContainer.classList.remove('bg-surface-container-lowest', 'border-outline-variant');
                    activeContainer.classList.add('bg-surface-container-low', 'border-primary-container');
                    
                    const activeCheckContainer = activeContainer.querySelector('.rounded-full');
                    activeCheckContainer.classList.remove('border-outline');
                    activeCheckContainer.classList.add('border-primary-container', 'bg-primary-container');
                });
            });
        });
    </script>
