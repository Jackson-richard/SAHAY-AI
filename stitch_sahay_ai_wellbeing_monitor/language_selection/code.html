<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-background min-h-screen flex flex-col items-center justify-center font-body-md text-on-background">
<!-- Top App Bar (Semantic Shell - Suppressed for Onboarding as per rules, but included if explicitly requested. Here we suppress as it's linear onboarding, but wait, the prompt doesn't explicitly ask for it, but the system prompt mentions it. We'll omit the shell for a cleaner onboarding flow as per "Automatic Suppression" rule.) -->
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-container-margin py-xl flex flex-col min-h-screen justify-between md:min-h-fit md:bg-surface-container-lowest md:shadow-sm md:rounded-xl md:p-xl md:my-xl">
<div class="flex-1 flex flex-col">
<!-- Header Section -->
<div class="text-center mb-xl pt-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary-container mb-lg">
<span class="material-symbols-outlined text-4xl fill">language</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface mb-sm">Choose your language</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Select the language you are most comfortable with.</p>
</div>
<!-- Language Options List -->
<div class="space-y-sm flex-1">
<!-- English -->
<label class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant p-md rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors touch-action-manipulation min-h-[64px] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary">
<div class="flex items-center gap-md">
<input checked="" class="w-6 h-6 text-primary border-outline-variant focus:ring-primary focus:ring-offset-0" name="language" type="radio" value="en"/>
<span class="font-body-lg text-body-lg font-medium text-on-surface">English</span>
</div>
</label>
<!-- Hindi -->
<label class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant p-md rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors touch-action-manipulation min-h-[64px] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary">
<div class="flex items-center gap-md">
<input class="w-6 h-6 text-primary border-outline-variant focus:ring-primary focus:ring-offset-0" name="language" type="radio" value="hi"/>
<span class="font-body-lg text-body-lg font-medium text-on-surface">हिन्दी</span>
</div>
</label>
<!-- Tamil -->
<label class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant p-md rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors touch-action-manipulation min-h-[64px] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary">
<div class="flex items-center gap-md">
<input class="w-6 h-6 text-primary border-outline-variant focus:ring-primary focus:ring-offset-0" name="language" type="radio" value="ta"/>
<span class="font-body-lg text-body-lg font-medium text-on-surface">தமிழ்</span>
</div>
</label>
<!-- Malayalam -->
<label class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant p-md rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors touch-action-manipulation min-h-[64px] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary">
<div class="flex items-center gap-md">
<input class="w-6 h-6 text-primary border-outline-variant focus:ring-primary focus:ring-offset-0" name="language" type="radio" value="ml"/>
<span class="font-body-lg text-body-lg font-medium text-on-surface">മലയാളം</span>
</div>
</label>
<!-- Telugu -->
<label class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant p-md rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors touch-action-manipulation min-h-[64px] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary">
<div class="flex items-center gap-md">
<input class="w-6 h-6 text-primary border-outline-variant focus:ring-primary focus:ring-offset-0" name="language" type="radio" value="te"/>
<span class="font-body-lg text-body-lg font-medium text-on-surface">తెలుగు</span>
</div>
</label>
</div>
</div>
<!-- Sticky Bottom Action -->
<div class="pt-xl pb-lg mt-auto sticky bottom-0 bg-background md:bg-transparent md:pt-xl md:pb-0">
<button class="w-full bg-primary-container text-on-primary-container font-label-lg text-label-lg rounded-full min-h-[56px] flex items-center justify-center hover:bg-primary-fixed transition-colors active:scale-95 duration-150">
                Continue
                <span class="material-symbols-outlined ml-xs">arrow_forward</span>
</button>
</div>
</main>
<script>
        // Simple interaction to highlight the selected card for better visual feedback
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Remove highlight from all
                document.querySelectorAll('label').forEach(label => {
                    label.classList.remove('border-primary', 'bg-surface-container-low');
                    label.classList.add('border-outline-variant', 'bg-surface-container-lowest');
                });
                
                // Add highlight to selected
                if(this.checked) {
                    const parentLabel = this.closest('label');
                    parentLabel.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
                    parentLabel.classList.add('border-primary', 'bg-surface-container-low');
                }
            });
        });

        // Initialize state on load
        const checkedRadio = document.querySelector('input[type="radio"]:checked');
        if(checkedRadio) {
            const parentLabel = checkedRadio.closest('label');
            parentLabel.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
            parentLabel.classList.add('border-primary', 'bg-surface-container-low');
        }
    </script>
